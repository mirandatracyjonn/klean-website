<!-- title: Find a laundromat -->
<!-- description: Klean laundromats near you, with washers and dryers free right now. -->
<!-- scripts: find.js -->
<section class="block">
  <div class="wrap">
    <div class="kicker">Find a laundromat</div>
    <h2>Free machines, right now</h2>
    <p class="intro">Live availability at every Klean laundromat. Scan any free machine with the Klean app to pay and start.</p>
    <form class="search" id="search-form" role="search">
      <input id="search" type="search" placeholder="City, street or laundromat" aria-label="Search laundromats">
      <button class="btn btn-brand" type="submit">Search</button>
      <button class="btn btn-outline" type="button" id="near-me">📍 Near me</button>
    </form>
    <div id="map" class="find-map" role="region" aria-label="Map of Klean laundromats"></div>
    <p class="meta find-map-credit">Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
    <div id="results" aria-live="polite"></div>
  </div>
</section>
